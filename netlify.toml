# Boats for Charity — Production & Analytics Configuration

[build]
  command = "npm test"
  publish = "."

[[redirects]]
  from = "/admin/dashboard"
  to = "/.netlify/functions/admin-dashboard"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions]
  node_bundler = "esbuild"
